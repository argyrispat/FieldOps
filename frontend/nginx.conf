server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. Adjust Content-Security-Policy connect-src
    # if the API is served from a different origin in your deployment.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: allow same-origin assets; connect to the demo API origin(s).
    # When deploying over HTTPS, prefer https:// API URLs and add
    # Strict-Transport-Security at the TLS-terminating proxy.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080;" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html (client-side routing).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Optional same-origin proxy: build with VITE_API_URL=/api and uncomment.
    # location /api/ {
    #     proxy_pass http://api:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     client_max_body_size 25m;
    # }
}
